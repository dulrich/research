[package]
name = "parse_number"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]

[features]
# `#![no_std]` + `alloc` (global allocator backed by sqlite3_malloc).
nostd = []
# Round 5: stub `rust_eh_personality` for `nostd` builds without LTO.
eh-stub = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
