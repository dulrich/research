[package]
name = "parse_number"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

# No dependencies: SQLite is reached through the sqlite3_api_routines table
# that SQLite hands to the extension entry point.
[dependencies]

[features]
# Build without the Rust standard library (core only).
nostd = []
# Inline Clinger fast path (port of the c-fast decimal path) instead of
# copying into a buffer and calling str::parse.
fast = []
# With `fast`: slow path calls the C library strtod() instead of core's
# str::parse::<f64> (smaller, but locale-dependent like c-fast).
strtod = ["fast"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
